name: Offline full workflow quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      MODEL_CALLS_ENABLED: 'false'
      VISION_CALLS_ENABLED: 'false'
      PA_DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:frontend
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: docker build --tag product-architect-worker:1.0 --file runtime/worker/Dockerfile runtime/worker
      - run: docker build --tag product-architect-fullstack:1.0 --file runtime/fullstack/Dockerfile runtime/fullstack
      - run: python scripts/offline_quality.py --output outputs/offline-quality
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: offline-quality-evidence
          path: outputs/offline-quality/
          retention-days: 14
